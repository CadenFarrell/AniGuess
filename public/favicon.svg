<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- AniArcade. A joystick on a pop-pink sticker tile: the same ink border and
       flat offset shadow as every button in the app (--shadow-pop is a hard
       0 6px drop, not a blur), so the tab icon reads as part of the UI kit.
       Colours are the --color-pop-pink / --color-ink tokens from src/index.css. -->

  <!-- Hard shadow. Drawn first and inset horizontally so it only peeks out
       below the tile, the way shadow-pop does. -->
  <rect x="4" y="8" width="40" height="36" rx="10" fill="#07070d"/>

  <!-- Tile -->
  <rect x="4" y="3" width="40" height="36" rx="10" fill="#ff4d8d" stroke="#07070d" stroke-width="3"/>

  <!-- Joystick. Shaft and base go down first so the ball caps the shaft. -->
  <rect x="21.25" y="18" width="5.5" height="11" fill="#07070d"/>
  <rect x="12" y="27" width="24" height="7.5" rx="3.75" fill="#07070d"/>
  <circle cx="24" cy="16" r="6" fill="#fff" stroke="#07070d" stroke-width="3"/>
</svg>
